name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # Publishing a release builds and tests its tag, then attaches the build.
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: tools/build.sh

      - name: Pull Azahar
        run: docker pull -q linuxserver/azahar:latest

      # Boots the .3dsx and the installed .cia in Azahar with a small test
      # ROM, and checks that it renders and takes input.
      - name: Smoke test in Azahar
        run: tools/azahar/smoketest.py

      # Generated test ROMs for the mappers added in this fork.
      - name: Mapper tests in Azahar
        run: tools/azahar/mappertest.py

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: virtuanes_3ds
          path: |
            virtuanes_3ds.3dsx
            virtuanes_3ds.cia
            virtuanes_3ds.smdh
            virtuanes_3ds_top.png

      - name: Upload test screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests
          path: |
            .azahar/smoketest/
            .azahar/mappertest/
          include-hidden-files: true
          if-no-files-found: ignore

  # The code that otherwise only runs on a real 3DS (the sound thread, GPU
  # waits, HOME menu hooks, Exit, closing from the HOME menu), in Azahar.
  # Each of these once broke on hardware while every other test passed.
  hardware-paths:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check for known causes of real-hardware bugs
        run: tools/check_hardware_pitfalls.py

      - name: Build with the real-hardware paths forced on
        run: tools/build.sh HWTEST=1

      - name: Pull Azahar
        run: docker pull -q linuxserver/azahar:latest

      - name: Real-hardware paths in Azahar
        run: tools/azahar/hwpathtest.py

      - name: Upload screenshots, logs and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hwpathtest
          path: .azahar/hwpathtest/
          include-hidden-files: true
          if-no-files-found: ignore

  # Attaches the tested build to a published release.
  release:
    if: github.event_name == 'release'
    needs: [build, hardware-paths]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: virtuanes_3ds

      - name: Attach build to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          tools/package_release.sh "$TAG" dist
          gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
